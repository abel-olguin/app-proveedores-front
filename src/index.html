<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Servicios</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      .app-preloader {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      .app-preloader__content {
        display: grid;
        justify-items: center;
        gap: 22px;
      }

      .app-preloader__logo {
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
        border-radius: 28px;
        background: #0d6efd;
        color: #ffffff;
        font-size: 2.4rem;
        font-weight: 900;
      }

      .app-preloader__dots {
        display: inline-flex;
        gap: 10px;
      }

      .app-preloader__dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0;
        animation: app-preloader-dot 1.8s infinite;
      }

      .app-preloader__dot:nth-child(2) {
        animation-delay: 0.3s;
      }

      .app-preloader__dot:nth-child(3) {
        animation-delay: 0.6s;
      }

      @media (prefers-color-scheme: dark) {
        .app-preloader {
          background: #09090b;
          color: #ffffff;
        }

        .app-preloader__logo {
          background: #ffffff;
          color: #09090b;
        }
      }

      @keyframes app-preloader-dot {
        0%,
        100% {
          opacity: 0;
        }
        18%,
        52% {
          opacity: 0.5;
        }
        35% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-preloader" aria-label="Cargando Servicios">
        <div class="app-preloader__content">
          <div class="app-preloader__logo" aria-hidden="true">S</div>
          <div class="app-preloader__dots" aria-hidden="true">
            <span class="app-preloader__dot"></span>
            <span class="app-preloader__dot"></span>
            <span class="app-preloader__dot"></span>
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
