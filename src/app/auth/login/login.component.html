<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="back-button"
      type="button"
      [attr.aria-label]="'auth.login.back' | translate"
      (click)="goBack()"
    >
      <span aria-hidden="true">←</span>
    </button>

    <div class="login-heading">
      <h1 id="login-title">{{ 'auth.login.title' | translate }}</h1>
    </div>

    <form class="login-form">
      <label class="field">
        <span>{{ 'auth.login.email' | translate }}</span>
        <input hlmInput type="email" autocomplete="email" placeholder="correo@ejemplo.com" />
      </label>

      <label class="field">
        <span>{{ 'auth.login.password' | translate }}</span>
        <span class="password-field">
          <input
            hlmInput
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button class="password-toggle" type="button" (click)="togglePasswordVisibility()">
            {{ (showPassword ? 'auth.login.hidePassword' : 'auth.login.showPassword') | translate }}
          </button>
        </span>
      </label>

      <button hlmBtn class="continue-button" type="button">{{ 'auth.login.continue' | translate }}</button>
    </form>

    <a class="forgot-link" routerLink="/auth/recover-password">{{ 'auth.login.forgotPassword' | translate }}</a>

    <div class="divider" aria-hidden="true">
      <span></span>
      <strong>{{ 'auth.login.or' | translate }}</strong>
      <span></span>
    </div>

    <button hlmBtn variant="outline" class="google-button" type="button">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="#4285f4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
        />
        <path
          fill="#34a853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        />
        <path
          fill="#fbbc05"
          d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"
        />
        <path
          fill="#ea4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z"
        />
      </svg>
      {{ 'auth.login.continueWithGoogle' | translate }}
    </button>
  </section>
</main>
